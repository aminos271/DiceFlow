schema_version: 1
id: tomb_entrance
title: 古墓入口
intro: DiceFlow MVP：20 轮内逃出古墓。输入 q/quit/退出 结束。
invalid_action_event: 行动没有成立，但局势没有停下，守卫继续压迫你的空间。
player:
  hp: 10
  max_hp: 10
  inventory:
  - 短剑
  - 火把
  location: 古墓入口
scene:
  name: 古墓入口
  description: 昏暗石室里潮气很重。一个守卫挡在左门前，门缝里透出微弱冷光。
flags:
  found_exit: false
  door_open: false
  game_over: false
  ending: ''
action_rules:
- when:
    intent_family: open
    target_id: left_door
    entities:
      guard_1:
        alive: true
  valid: false
  reason: 守卫仍挡在门前，你必须先处理守卫或摆脱他的压制。
dc_modifiers:
- when:
    intent_family: open
    target_id: left_door
    target:
      weakened: true
  modifier: -3
- when:
    intent_family: attack
    target_id: guard_1
    target:
      hostile: false
  modifier: -2
derivation_rules:
- id: fallen_enemy_leaves_corpse
  when:
    result:
    - success
    - critical_success
    target_tags:
    - enemy
    target:
      alive: false
  spawn:
    id_template: $target_id_corpse
    entity:
      name: $target_name的尸体
      aliases:
      - 尸体
      - $target_name尸体
      - $target_name的尸体
      type: corpse
      tags:
      - corpse
      - searchable
      - derived
      metadata:
        allowed_actions:
        - inspect
        - take
        actions:
          inspect:
            dc: 5
            outcomes:
              success:
                events:
                - 你检查了$target_name，确认他已经失去威胁。
          take:
            dc: 8
            outcomes:
              critical_success:
                entities:
                  $target:
                    looted: true
                events:
                - 你仔细搜过尸体，只找到破损的护具和无用杂物，没有钥匙。
              success:
                entities:
                  $target:
                    looted: true
                events:
                - 你搜刮了尸体，没有找到钥匙或可用物品。
              fail:
                events:
                - 你匆忙翻找尸体，没有找到有价值的东西。
              critical_fail:
                player:
                  hp_delta: -1
                events:
                - 你翻动尸体时被破裂甲片划伤，没有找到钥匙。
world:
  premise: 玩家被困在古墓中，必须找到出口逃出。
  tone: 阴森、紧迫
  allowed_scene_types: [corridor, chamber, hall, passage]
  allowed_entity_types: [pickup, container, npc, obstacle]
  forbidden: []
  max_runtime_dc: 14
  max_new_entities_per_transition: 3
ending_texts:
  victory: 守卫已经倒下，左门彻底敞开，你穿过冷光中的通道，逃出了古墓入口。
  death: 你的伤势压过了意志，视线沉入黑暗，本次冒险到此结束。
  timeout: 你拖得太久，古墓深处传来沉重机关声，退路被封死。
dynamic_entity_templates:
  discover:
    type: container
    name: 暗格
    aliases: [暗格, 隐藏格]
    tags: [container, dynamic]
    contents: []
  create_environment:
    type: container
    name: 障碍物
    aliases: [障碍, 障碍物]
    tags: [container, obstacle, dynamic]
entities:
  guard_1:
    name: 守卫
    aliases:
    - 守卫
    - 卫兵
    - 敌人
    - 看守
    metadata:
      allowed_actions:
      - attack
      - talk
      - inspect
      actions:
        attack:
          dc: 12
          outcomes:
            critical_success:
              entities:
                $target:
                  hp_delta: -5
              events:
              - 你抓住破绽重创守卫。
            success:
              entities:
                $target:
                  hp_delta: -3
              events:
              - 你的攻击命中守卫。
            fail:
              player:
                hp_delta: -1
              events:
              - 守卫挡下攻击，但他的站位暴露了左门锁孔。
            critical_fail:
              player:
                hp_delta: -2
              events:
              - 攻击落空，守卫反击得手。
        talk:
          dc: 13
          outcomes:
            critical_success:
              entities:
                $target:
                  hostile: false
              events:
              - 守卫的敌意明显动摇，攻击他的难度降低了。
            success:
              entities:
                $target:
                  hostile: false
              events:
              - 守卫的敌意短暂动摇，攻击他的难度降低了。
            fail:
              player:
                hp_delta: -1
              events:
              - 交涉失败，守卫用盾牌把你逼退。
            critical_fail:
              player:
                hp_delta: -2
              events:
              - 你的话激怒了守卫，他立刻逼近反击。
        inspect:
          dc: 10
          outcomes:
            critical_success:
              events:
              - 你看穿守卫换手时的破绽，下一次进攻会更容易。
            success:
              events:
              - 你观察到守卫每次换手都会露出短暂破绽。
            fail:
              events:
              - 你没看出更多信息，但守卫仍被牵制在左门前。
            critical_fail:
              player:
                hp_delta: -1
              events:
              - 你检查时分神，守卫逼近并让你撞上石壁。
    hp: 6
    max_hp: 6
    alive: true
    location: 入口
    hostile: true
    inventory:
    - guard_1_shield
    equipped:
      offhand: guard_1_shield
    tags:
    - enemy
    - human
    - hostile
  guard_1_shield:
    name: 盾牌
    aliases:
    - 盾牌
    - 守卫的盾牌
    - 破损盾牌
    type: item
    item_id: 盾牌
    source: guard_1
    holder_id: guard_1
    location: guard_1
    visible: false
    available: false
    value: 5
    rarity: common
    durability: 2
    properties:
      defense: 1
      condition: damaged
    tags:
    - item
    - equipment
    - shield
    hooks:
      take_critical_success_events:
      - 你取下守卫的盾牌，虽然边缘破损，但仍能派上用场。
      take_success_events:
      - 你拿起守卫的盾牌，收进可用装备里。
      take_fail_events:
      - 盾牌压在尸体下面，你需要再调整一下角度。
      inspect_success_events:
      - 这面盾牌有明显裂痕，但还能挡住一次正面冲击。
  left_door:
    name: 左门
    aliases:
    - 左门
    - 门
    - 石门
    - 出口
    metadata:
      allowed_actions:
      - open
      - use
      - inspect
      actions:
        open:
          dc: 14
          outcomes:
            critical_success:
              entities:
                $target:
                  locked: false
              flags:
                found_exit: true
                door_open: true
              events:
              - 左门猛地打开，冷光后的通道显露出来。
            success:
              entities:
                $target:
                  locked: false
              flags:
                found_exit: true
                door_open: true
              events:
              - 左门打开，冷光后的通道显露出来。
            fail:
              entities:
                $target:
                  weakened: true
              flags:
                found_exit: true
              events:
              - 门没有打开，但锁芯松动，你确认门后就是出口。
            critical_fail:
              player:
                hp_delta: -2
              entities:
                $target:
                  weakened: true
              events:
              - 门锁崩裂弹片划伤你，但锁芯已经松动。
        use:
          dc: 10
          required_tools:
          - 火把
          outcomes:
            critical_success:
              entities:
                $target:
                  weakened: true
              flags:
                found_exit: true
              events:
              - 火把精准烤裂门锁外壳，锁芯变得很脆弱。
            success:
              entities:
                $target:
                  weakened: true
              flags:
                found_exit: true
              events:
              - 火把烤裂了门锁外壳，锁芯更容易处理了。
            fail:
              entities:
                $target:
                  weakened: true
              events:
              - 火焰没烧开门，却照出了锁孔旁的裂缝。
            critical_fail:
              player:
                hp_delta: -1
                inventory_remove:
                - 火把
              events:
              - 火把爆出火星灼伤你的手，火把也熄灭了。
        inspect:
          dc: 10
          outcomes:
            critical_success:
              flags:
                found_exit: true
              entities:
                $target:
                  weakened: true
              events:
              - 你看清左门锁孔磨损严重，门后有风声。
            success:
              flags:
                found_exit: true
              entities:
                $target:
                  weakened: true
              events:
              - 你看清左门锁孔磨损严重，门后有风声。
            fail:
              flags:
                found_exit: true
              events:
              - 你没找到机关，但确认左门后有可通行的空间。
            critical_fail:
              player:
                hp_delta: -1
              events:
              - 你检查时分神，守卫逼近并让你撞上石壁。
    type: door
    locked: true
    burnable: true
    weakened: false
    tags:
    - door
    - openable
    - locked
    - stone
scene_actions:
  flee:
    dc: 12
    outcomes:
      critical_success:
        flags:
          found_exit: true
        events:
        - 你拉开距离，找到通往左门的短暂空隙。
      success:
        flags:
          found_exit: true
        events:
        - 你拉开距离，找到通往左门的短暂空隙。
      fail:
        player:
          hp_delta: -1
        events:
        - 你没能脱离守卫的控制范围。
      critical_fail:
        player:
          hp_delta: -2
        events:
        - 你后退时踩空，守卫趁机追击。
  wait:
    dc: 8
    outcomes:
      critical_success:
        events:
        - 你稳住呼吸，完整看清了守卫的攻击节奏。
      success:
        events:
        - 你稳住呼吸，观察到守卫每次换手都会露出破绽。
      fail:
        player:
          hp_delta: -1
        events:
        - 你停得太久，守卫向前压迫并迫使你后退。
      critical_fail:
        player:
          hp_delta: -2
        events:
        - 你停得太久，守卫直接冲了上来。
  unknown:
    dc: 12
    outcomes:
      critical_success:
        events:
        - 你短暂迟疑后仍稳住了局势，找到一个新的观察角度。
      success:
        events:
        - 你短暂迟疑，但仍让局势向前推进。
      fail:
        player:
          hp_delta: -1
        events:
        - 迟疑让守卫抢占了位置，你被逼退并擦伤。
      critical_fail:
        player:
          hp_delta: -2
        events:
        - 迟疑让守卫完全抢占先机，你被重重逼退。
reaction_rules:
- id: hostile_target_counterattack
  actor: target
  when:
    intent_family: attack
    result:
    - success
    - fail
    target_alive: true
    target_tags:
    - enemy
    - hostile
  changes:
    player:
      hp_delta: -2
    events:
    - $actor_name怒吼着扑向你，你受到2点伤害。
ending_conditions:
- ending: death
  when:
    player_hp_lte: 0
- ending: victory
  when:
    flags:
      door_open: true
    entities:
      guard_1:
        alive: false
- ending: timeout
  when:
    turn_id_gte: 20
