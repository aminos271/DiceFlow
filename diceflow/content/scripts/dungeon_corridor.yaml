schema_version: 1
id: dungeon_corridor
title: 地牢走廊
intro: 你被困在一条阴暗的地牢走廊中。找到钥匙并打开铁门逃离。20 回合内完成。
invalid_action_event: 你的行动没有奏效，但危险正在逼近。
player:
  hp: 10
  max_hp: 10
  inventory: []
  location: 走廊
scene:
  name: 地牢走廊
  description: 狭长的石质走廊尽头是一扇沉重的铁门。一只巡逻的骷髅缓慢徘徊。角落里有一个破旧的木箱。
flags:
  has_key: false
  door_open: false
  game_over: false
  ending: ''
world:
  premise: 玩家被困在地牢走廊中，需要找到铁钥匙并打开铁门逃离。
  tone: 阴暗、紧张、低魔
  allowed_scene_types: [corridor, cell, storage, passage]
  allowed_entity_types: [pickup, container, npc, obstacle]
  forbidden:
  - 现代科技
  - 枪械
  - 直接生成出口钥匙之外的通关神器
  - 绕过铁门逃离地牢
  max_runtime_dc: 14
  max_new_entities_per_transition: 3
entities:
  skeleton_1:
    name: 骷髅守卫
    aliases:
    - 骷髅
    - 守卫
    - 敌人
    metadata:
      allowed_actions:
      - inspect
      actions:
        inspect:
          dc: 10
          outcomes:
            success:
              events:
              - 你发现骷髅行动缓慢，似乎反应迟钝。
            fail:
              events:
              - 你没有发现有用信息。
    hp: 5
    max_hp: 5
    alive: true
    location: 走廊
    tags:
    - enemy
    - fragile
    - hostile
  chest_1:
    name: 木箱
    aliases:
    - 箱子
    - 木箱
    type: container
    hooks:
      open_critical_success_events:
      - 你轻松打开木箱，一把铁钥匙露了出来。
      open_success_events:
      - 你打开木箱，看见里面有一把铁钥匙。
      open_fail_events:
      - 木箱卡住了，但你觉得还能再试。
      open_critical_fail_events:
      - 木箱突然崩裂碎片划伤你。
      inspect_success_events:
      - 你确认这个木箱可能藏有物品。
    contents:
    - iron_key
    tags:
    - container
    - movable
    - heavy
    - throwable
    - improvised_weapon
  iron_key:
    name: 铁钥匙
    aliases:
    - 钥匙
    - 铁钥匙
    type: pickup
    item_id: 铁钥匙
    visible: false
    available: false
    hooks:
      take_flags:
        has_key: true
      take_critical_success_events:
      - 你立刻捡起铁钥匙并收好。
      take_success_events:
      - 你拿起铁钥匙并收好。
      take_fail_events:
      - 铁钥匙卡在木缝里，你需要再试一次。
      inspect_success_events:
      - 这是一把可以开启铁门的钥匙。
    tags:
    - item
    - tool
    - key
  iron_door:
    name: 铁门
    aliases:
    - 门
    - 铁门
    - 出口
    type: door
    hooks:
      required_tools:
      - 铁钥匙
      open_flags:
        door_open: true
      use_flags:
        door_open: true
      open_critical_success_events:
      - 铁门被你顺利打开，出口就在眼前。
      open_success_events:
      - 铁门被打开，你看到了出口。
      open_fail_events:
      - 钥匙卡住了，你需要再试一次。
      open_critical_fail_events:
      - 你用力过猛，钥匙滑脱划伤手指。
      use_critical_success_events:
      - 你低调地把铁钥匙插入锁孔，铁门顺畅打开。
      use_success_events:
      - 铁钥匙转动锁芯，铁门被打开。
      use_fail_events:
      - 钥匙卡住了，你需要调整角度再试一次。
      use_critical_fail_events:
      - 你用力过猛，钥匙滑脱划伤手指。
      inspect_success_events:
      - 这是一扇厚重铁门，需要钥匙才能打开。
    locked: true
    tags:
    - door
    - openable
    - locked
scene_actions:
  move:
    dc: 9
    outcomes:
      critical_success:
        events:
        - 你贴着墙根无声前进，靠近铁门时没有惊动骷髅。
      success:
        events:
        - 你压低脚步向铁门移动，仍保持着与骷髅的距离。
      fail:
        events:
        - 你靠近了铁门，但脚步声让骷髅转向你的方向。
      critical_fail:
        player:
          hp_delta: -1
        events:
        - 你踩到松动石块，骷髅立刻逼近并擦伤了你。
  flee:
    dc: 10
    outcomes:
      success:
        events:
        - 你拉开距离，暂时避开了骷髅。
      fail:
        player:
          hp_delta: -1
        events:
        - 骷髅紧追不放。
  wait:
    dc: 8
    outcomes:
      success:
        events:
        - 你稳定呼吸，观察局势。
  unknown:
    dc: 12
    outcomes:
      critical_success:
        events:
        - 你短暂迟疑后重新掌握节奏，局势仍向前推进。
      success:
        events:
        - 你调整姿态，谨慎地观察走廊中的威胁。
      fail:
        player:
          hp_delta: -1
        events:
        - 迟疑让骷髅靠近，你被迫后退并擦伤。
      critical_fail:
        player:
          hp_delta: -2
        events:
        - 你判断失误，骷髅抢先压上来重击了你。
reaction_rules:
- id: hostile_target_counterattack
  actor: target
  when:
    intent_family: attack
    result:
    - success
    - fail
    target_alive: true
    target_tags:
    - enemy
    - hostile
  changes:
    player:
      hp_delta: -1
    events:
    - $actor_name趁势反扑，你受到1点伤害。
ending_conditions:
- ending: death
  when:
    player_hp_lte: 0
- ending: victory
  when:
    flags:
      door_open: true
      has_key: true
- ending: timeout
  when:
    turn_id_gte: 20
generic_rules:
- id: attack_enemy
  when:
    intent_family: attack
    target_tags: enemy
  dc: 11
  outcomes:
    critical_success:
      entities:
        $target:
          hp_delta: -6
      events:
      - 你精准击碎骷髅的核心，它瞬间散架。
    success:
      entities:
        $target:
          hp_delta: -3
      events:
      - 你的攻击击中了骷髅。
    fail:
      player:
        hp_delta: -1
      events:
      - 骷髅挡住攻击并反击。
    critical_fail:
      player:
        hp_delta: -2
      events:
      - 你失去平衡，被骷髅重击。
- id: heavy_throwable_hits_fragile_enemy
  when:
    intent_family:
    - use
    - throw
    target_tags:
    - enemy
    - fragile
    tool_tags:
    - heavy
    - throwable
  dc: 10
  outcomes:
    critical_success:
      entities:
        $target:
          hp_delta: -5
      set_entity_states:
        $tool:
          destroyed: true
          available: false
          visible: false
      spawn_entities:
        $tool_debris:
          name: $tool_name残片
          aliases:
          - 残片
          - 碎片
          - $tool_name残片
          type: container
          tags:
          - debris
          - container
          - searchable
          contents: $tool_contents
      reveal_entities: $tool_contents
      events:
      - 你抡起$tool_name砸碎$target_name，$tool_name裂成残片，里面的东西露了出来。
    success:
      entities:
        $target:
          hp_delta: -3
      set_entity_states:
        $tool:
          destroyed: true
          available: false
          visible: false
      spawn_entities:
        $tool_debris:
          name: $tool_name残片
          aliases:
          - 残片
          - 碎片
          - $tool_name残片
          type: container
          tags:
          - debris
          - container
          - searchable
          contents: $tool_contents
      reveal_entities: $tool_contents
      events:
      - $tool_name砸中$target_name后碎裂，残片散开，里面的东西暴露出来。
    fail:
      player:
        hp_delta: -1
      events:
      - 你没能抡稳$tool_name，$target_name趁机逼近。
    critical_fail:
      player:
        hp_delta: -2
      events:
      - $tool_name脱手撞在墙上，你被$target_name重击。
