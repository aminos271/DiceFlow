title: 边境旅店大厅
aliases: [旅店, 大厅, 吧台, 旅店大厅]
summary: 旅店大厅里炉火正旺，几张木桌散落在大厅各处。老板在吧台后忙碌，空气中弥漫着麦酒和烤肉的香气。
content: |
  边境旅店是一座用粗犷原木搭成的两层建筑，大厅占据了底层的大部分空间。正中央的石砌壁炉里火焰正旺，驱散了从门外不断钻入的寒意。

  几张厚重的橡木桌子散落在大厅各处，桌面上满是刀痕和酒杯印——这些都是无数个夜晚里冒险者们留下的印记。

  吧台占据了整面东墙，后面的架子上摆满了各式酒瓶。旅店老板正站在吧台后，用一块白布擦拭着杯子。

  角落里坐着一个披斗篷的旅人，帽檐拉得很低，似乎不想被人注意。大门外是一条泥泞的官道，通向远方的城镇和荒野。
