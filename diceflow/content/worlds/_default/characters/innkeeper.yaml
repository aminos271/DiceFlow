id: innkeeper
title: 旅店老板
aliases: [老板, 掌柜, 店主]
summary: "特质: 热情, 健谈, 消息灵通；举止: 笑容满面；经营旅店，希望客人满意；态度: 友善"
content: |
  旅店老板是一个中年男人，微微发福的身材和永远挂在脸上的笑容让人感到安心。他在边境经营这家旅店已经十多年，见过无数来来往往的冒险者、商人和旅人。

  他对各地的传闻和本地消息了如指掌，如果你需要打听什么，他一定知无不言——前提是他觉得你值得信任。

  吧台后面挂着一排各式酒瓶，从廉价麦酒到进口的精灵葡萄酒都有存货。老板对自己的调酒手艺颇为自豪。
tags: [npc, 旅店, 老板, 友善]
