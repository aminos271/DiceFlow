player:
  hp: 10
  max_hp: 10
  inventory: []
  location: 走廊
scene:
  name: 地牢走廊
  description: 狭长的石质走廊尽头是一扇沉重的铁门。一只巡逻的骷髅缓慢徘徊。角落里有一个破旧的木箱。
flags:
  has_key: false
  door_open: false
  game_over: false
  ending: ''
world:
  premise: 玩家被困在地牢走廊中，需要找到铁钥匙并打开铁门逃离。
  tone: 阴暗、紧张、低魔
  allowed_scene_types: [corridor, cell, storage, passage]
  allowed_entity_types: [pickup, container, npc, obstacle]
  forbidden:
  - 现代科技
  - 枪械
  - 直接生成出口钥匙之外的通关神器
  - 绕过铁门逃离地牢
  max_runtime_dc: 14
  max_new_entities_per_transition: 3
entities:
  skeleton_1:
    name: 骷髅守卫
    aliases: [骷髅, 守卫, 敌人]
    type: npc
    hp: 5
    max_hp: 5
    alive: true
    location: 走廊
    hostile: true
    disposition: hostile
    tags: [enemy, fragile, hostile]
    metadata:
      allowed_actions: [attack, inspect]
      actions:
        attack:
          dc: 11
          outcomes:
            critical_success:
              entities:
                $target:
                  hp_delta: -6
              events: [你精准击碎骷髅的核心，它瞬间散架。]
            success:
              entities:
                $target:
                  hp_delta: -3
              events: [你的攻击击中了骷髅。]
            fail:
              player:
                hp_delta: -1
              events: [骷髅挡住攻击并反击。]
            critical_fail:
              player:
                hp_delta: -2
              events: [你失去平衡，被骷髅重击。]
        inspect:
          dc: 10
          outcomes:
            success:
              events: [你发现骷髅行动缓慢，似乎反应迟钝。]
            fail:
              events: [你没有发现有用信息。]
  chest_1:
    name: 木箱
    aliases: [箱子, 木箱]
    type: container
    contents: [iron_key]
    tags: [container, movable, heavy, throwable, improvised_weapon]
    metadata:
      allowed_actions: [open, inspect]
      actions:
        open:
          dc: 9
          outcomes:
            critical_success:
              reveal_entities: [iron_key]
              events: [你轻松打开木箱，一把铁钥匙露了出来。]
            success:
              reveal_entities: [iron_key]
              events: [你打开木箱，看见里面有一把铁钥匙。]
            fail:
              events: [木箱卡住了，但你觉得还能再试。]
            critical_fail:
              player:
                hp_delta: -1
              events: [木箱突然崩裂碎片划伤你。]
        inspect:
          dc: 8
          outcomes:
            success:
              events: [你确认这个木箱可能藏有物品。]
  iron_key:
    name: 铁钥匙
    aliases: [钥匙, 铁钥匙]
    type: pickup
    item_id: 铁钥匙
    visible: false
    available: false
    tags: [item, tool, key]
    metadata:
      allowed_actions: [take, inspect]
      actions:
        take:
          dc: 6
          outcomes:
            critical_success:
              move_item_to_inventory: [$target]
              flags:
                has_key: true
              events: [你立刻捡起铁钥匙并收好。]
            success:
              move_item_to_inventory: [$target]
              flags:
                has_key: true
              events: [你拿起铁钥匙并收好。]
            fail:
              events: [铁钥匙卡在木缝里，你需要再试一次。]
        inspect:
          dc: 6
          outcomes:
            success:
              events: [这是一把可以开启铁门的钥匙。]
  iron_door:
    name: 铁门
    aliases: [门, 铁门, 出口]
    type: door
    locked: true
    tags: [door, openable, locked]
    metadata:
      allowed_actions: [open, inspect, use]
      actions:
        open:
          dc: 12
          required_tools: [铁钥匙]
          outcomes:
            critical_success:
              entities:
                $target:
                  opened: true
                  locked: false
              flags:
                door_open: true
              events: [铁门被你顺利打开，出口就在眼前。]
            success:
              entities:
                $target:
                  opened: true
                  locked: false
              flags:
                door_open: true
              events: [铁门被打开，你看到了出口。]
            fail:
              events: [钥匙卡住了，你需要再试一次。]
            critical_fail:
              player:
                hp_delta: -1
              events: [你用力过猛，钥匙滑脱划伤手指。]
        use:
          dc: 10
          required_tools: [铁钥匙]
          outcomes:
            success:
              entities:
                $target:
                  opened: true
                  locked: false
              flags:
                door_open: true
              events: [铁钥匙转动锁芯，铁门被打开。]
            fail:
              events: [钥匙卡住了，你需要调整角度再试一次。]
        inspect:
          dc: 7
          outcomes:
            success:
              events: [这是一扇厚重铁门，需要钥匙才能打开。]
scene_actions:
  move:
    dc: 9
    outcomes:
      critical_success:
        events: [你贴着墙根无声前进，靠近铁门时没有惊动骷髅。]
      success:
        events: [你压低脚步向铁门移动，仍保持着与骷髅的距离。]
      fail:
        events: [你靠近了铁门，但脚步声让骷髅转向你的方向。]
      critical_fail:
        player:
          hp_delta: -1
        events: [你踩到松动石块，骷髅立刻逼近并擦伤了你。]
  flee:
    dc: 10
    outcomes:
      success:
        events: [你拉开距离，暂时避开了骷髅。]
      fail:
        player:
          hp_delta: -1
        events: [骷髅紧追不放。]
  wait:
    dc: 8
    outcomes:
      success:
        events: [你稳定呼吸，观察局势。]
ending_conditions:
- ending: death
  when:
    player_hp_lte: 0
- ending: victory
  when:
    flags:
      door_open: true
      has_key: true
- ending: timeout
  when:
    turn_id_gte: 20
