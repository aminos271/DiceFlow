id: guard_char
title: 守卫
aliases: [守卫, 卫兵, 看守, 敌人]
summary: "特质: 警惕, 职责感强, 寡言；举止: 低沉冷漠；奉命看守古墓入口，任何闯入者都是敌人；态度: 敌对"
content: |
  守卫是古墓入口的最后一道防线。他沉默寡言，眼神锐利，任何闯入者都会被视为敌人。

  他身着轻甲，手持利刃，虽然不算身经百战，但对古墓地形的熟悉让他在此占据优势。

  如果你能通过战斗击败他，或者找到其他方式绕过他的看守，通往墓室内部的道路将为你敞开。
tags: [npc, 守卫, 敌人]
